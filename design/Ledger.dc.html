<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#e7e9ec; font-family:'Plus Jakarta Sans',sans-serif; }
  a { color:#2f66f5; text-decoration:none; }
  a:hover { color:#2551c9; }
  ::-webkit-scrollbar{ display:none; }
  @keyframes popIn { 0%{transform:scale(.4);opacity:0;} 60%{transform:scale(1.08);opacity:1;} 100%{transform:scale(1);opacity:1;} }
  @keyframes fadeUp { from{transform:translateY(10px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(3px);} }
  @keyframes drawCheck { to { stroke-dashoffset:0; } }
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;font-family:'Plus Jakarta Sans',sans-serif;">
  <div style="width:390px;height:844px;background:#000;border-radius:52px;box-shadow:0 40px 90px -20px rgba(10,12,14,.55),0 0 0 2px #2a2c30;overflow:hidden;position:relative;">
    <!-- dynamic island -->
    <div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:45;"></div>
    <!-- status bar -->
    <div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 9px;font-size:15px;font-weight:700;z-index:40;color:{{ barColor }};">
      <span>{{ clock }}</span>
      <span style="display:flex;align-items:center;gap:7px;">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5" width="3" height="7" rx="1"></rect><rect x="10" y="2.5" width="3" height="9.5" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2a11 11 0 0 1 15 0"></path><path d="M3.5 6.8a7.2 7.2 0 0 1 10 0"></path><path d="M6 9.4a3.4 3.4 0 0 1 5 0"></path><circle cx="8.5" cy="11" r="0.7" fill="currentColor" stroke="none"></circle></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.6" y="0.6" width="21" height="11.8" rx="3" stroke="currentColor" stroke-width="1.2"></rect><rect x="2.4" y="2.4" width="16" height="8.2" rx="1.5" fill="currentColor"></rect><rect x="23" y="4" width="2" height="5" rx="1" fill="currentColor"></rect></svg>
      </span>
    </div>
    <!-- SCREEN -->
    <div style="position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;">{{ screen }}</div>
    <!-- toast -->
    <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;bottom:110px;left:24px;right:24px;background:#0e1113;color:#fff;padding:14px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 12px 28px rgba(10,12,14,.4);z-index:60;animation:fadeUp .3s ease;text-align:center;">{{ toast }}</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    route: 'signin', tab: 'Overview',
    pass: '', passErr: false, loading: false, stamp: false, toast: '',
    editItem: null, editGoal: null, activeGoal: null, viewCycle: null,
    cycleName: 'August 2026',
    items: [
      {id:1, name:'Rent', cat:'Fixed', amt:1850, on:true},
      {id:2, name:'Utilities', cat:'Fixed', amt:180, on:true},
      {id:3, name:'Groceries', cat:'Variable', amt:520, on:true},
      {id:4, name:'Dining out', cat:'Variable', amt:240, on:true},
      {id:5, name:'Transit', cat:'Variable', amt:95, on:false},
      {id:6, name:'Emergency fund', cat:'Savings', amt:400, on:true},
      {id:7, name:'Roth IRA', cat:'Savings', amt:500, on:true},
    ],
    goals: [
      {id:1, name:'Emergency fund', target:12000, saved:8400, note:'Six months of essentials.'},
      {id:2, name:'Kyoto trip', target:4500, saved:1650, note:'Two weeks, next spring.'},
      {id:3, name:'New laptop', target:2400, saved:2400, note:'Done — waiting on the sale.'},
    ],
    activity: [
      {id:1, name:'Whole Foods', cat:'Variable', when:'Today', amt:-64.20},
      {id:2, name:'Salary', cat:'Income', when:'Aug 1', amt:5200},
      {id:3, name:'Roth IRA', cat:'Savings', when:'Aug 1', amt:-500},
      {id:4, name:'Rent', cat:'Fixed', when:'Aug 1', amt:-1850},
    ],
    history: [
      {id:'aug', name:'August 2026', income:5200, spent:3385, saved:900, closed:false},
      {id:'jul', name:'July 2026', income:5200, spent:3610, saved:900, closed:true},
      {id:'jun', name:'June 2026', income:5000, spent:3980, saved:700, closed:true},
      {id:'may', name:'May 2026', income:5000, spent:4120, saved:600, closed:true},
    ],
    form: {},
  };

  componentDidMount(){ this.tick(); this._t=setInterval(()=>this.tick(),15000); }
  componentWillUnmount(){ clearInterval(this._t); }
  tick(){ const d=new Date(); this.setState({clock: d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false})}); }

  ic(name,size=24,color='currentColor',sw=2){
    const P={
      home:'', items:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',
      goals:'', history:'M12 7v5l3 2', settings:'',
      chevR:'M9 6l6 6-6 6', back:'M15 6l-6 6 6 6',
      inbox:'M4 13h4l1 3h6l1-3h4M4 13l2-8h12l2 8v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z',
      bell:'M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10.5 21a2 2 0 0 0 3 0',
      wallet:'M3 7h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l2-3h11l2 3M17 13h.01',
      up:'M7 17L17 7M17 7H8M17 7v9', down:'M17 7L7 17M7 17h9M7 17V8',
    };
    const c=[];
    if(name==='home'){ c.push(React.createElement('path',{key:1,d:'M3.5 10.5L12 4l8.5 6.5'}),React.createElement('path',{key:2,d:'M5.5 9.5V20h13V9.5'})); }
    else if(name==='goals'){ c.push(React.createElement('circle',{key:1,cx:12,cy:12,r:8}),React.createElement('circle',{key:2,cx:12,cy:12,r:3.4})); }
    else if(name==='history'){ c.push(React.createElement('circle',{key:1,cx:12,cy:12,r:8}),React.createElement('path',{key:2,d:P.history})); }
    else if(name==='settings'){ c.push(React.createElement('circle',{key:1,cx:12,cy:12,r:3}),React.createElement('path',{key:2,d:'M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1'})); }
    else if(name==='backspace'){ c.push(React.createElement('path',{key:1,d:'M20 6H9L4 12l5 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z'}),React.createElement('path',{key:2,d:'M15 9l-4 6M11 9l4 6'})); }
    else { c.push(React.createElement('path',{key:1,d:P[name]||''})); }
    return React.createElement('svg',{width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:color,strokeWidth:sw,strokeLinecap:'round',strokeLinejoin:'round'},c);
  }

  go(route, extra={}){ this.setState({route, ...extra}); }
  flash(msg){ this.setState({toast:msg}); clearTimeout(this._toast); this._toast=setTimeout(()=>this.setState({toast:''}),1900); }
  money(n){ const neg=n<0; return (neg?'-$':'$')+Math.abs(Number(n)).toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}); }
  setForm(k,v){ this.setState(s=>({form:{...s.form,[k]:v}})); }

  C(){ return {
    sheet:'#ffffff', soft:'#f5f6f8', ink:'#0e1113', sub:'#868b92', line:'#edeff2',
    blue:'#2f66f5', green:'#12a150', red:'#d64f3a',
    dark:'#0b0c0e', darkCard:'rgba(255,255,255,.055)', darkLine:'rgba(255,255,255,.12)', darkSub:'rgba(255,255,255,.55)',
    nav:'#17191d', tintBlue:'#eef3ff', tintRed:'#fdeeeb',
  }; }
  catColor(C,cat){ return cat==='Fixed'?'#5b6b8c':cat==='Variable'?'#c98a2b':cat==='Savings'?C.green:cat==='Income'?C.blue:C.sub; }

  renderVals(){
    const C=this.C();
    const dark=this.state.route==='signin'||this.state.route==='home';
    return { clock:this.state.clock||'9:41', toast:this.state.toast, barColor:dark?'#ffffff':'#0e1113', screen:this.renderScreen(C) };
  }

  // ---------- shared bits ----------
  statusPill(C,text,tone){
    const m={green:[C.green,'rgba(18,161,80,.12)'],gray:[C.sub,'rgba(134,139,146,.14)'],blue:[C.blue,'rgba(47,102,245,.12)']};
    const [col,bg]=m[tone]||m.gray;
    return React.createElement('span',{style:{fontSize:12,fontWeight:700,color:col,background:bg,borderRadius:999,padding:'5px 11px'}},text);
  }
  bottomNav(C){
    const tabs=[{k:'home',label:'Home',icon:'home'},{k:'items',label:'Items',icon:'items'},{k:'goals',label:'Goals',icon:'goals'},{k:'history',label:'History',icon:'history'},{k:'settings',label:'Settings',icon:'settings'}];
    const map={home:'home',items:'items',itemForm:'items',goals:'goals',goalDetail:'goals',goalForm:'goals',history:'history',pastCycle:'history',settings:'settings',newcycle:'home'};
    const active=map[this.state.route];
    return React.createElement('div',{style:{position:'absolute',bottom:20,left:16,right:16,height:62,background:C.nav,borderRadius:999,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 10px',zIndex:30,boxShadow:'0 16px 34px -10px rgba(10,12,14,.5)'}},
      tabs.map(t=>{
        const on=active===t.k;
        return React.createElement('button',{key:t.k,onClick:()=>this.go(t.k),style:{display:'flex',alignItems:'center',gap:8,background:on?'#fff':'transparent',borderRadius:999,border:'none',cursor:'pointer',padding:on?'10px 15px':'10px'}},
          this.ic(t.icon,21,on?C.ink:'rgba(255,255,255,.55)',on?2.1:1.9),
          on&&React.createElement('span',{style:{fontSize:13.5,fontWeight:700,color:C.ink}},t.label)
        );
      })
    );
  }
  scrollWhite(C,header,body){
    return React.createElement('div',{style:{height:'100%',background:C.sheet,position:'relative'}},
      React.createElement('div',{style:{height:'100%',overflowY:'auto',paddingBottom:110}},header,body),
      this.bottomNav(C)
    );
  }
  pageHead(C,title,sub,action){
    return React.createElement('div',{style:{padding:'64px 22px 8px',display:'flex',alignItems:'flex-start',justifyContent:'space-between'}},
      React.createElement('div',{},
        React.createElement('h1',{style:{fontSize:28,fontWeight:800,color:C.ink,letterSpacing:'-.02em'}},title),
        sub&&React.createElement('div',{style:{fontSize:14,fontWeight:500,color:C.sub,marginTop:3}},sub)
      ),
      action&&React.createElement('button',{onClick:action.on,style:{display:'flex',alignItems:'center',gap:6,background:C.ink,color:'#fff',border:'none',borderRadius:999,padding:'11px 16px',fontSize:14,fontWeight:700,cursor:'pointer',marginTop:4}},action.label)
    );
  }
  backBar(C,to,label){
    return React.createElement('div',{style:{padding:'62px 22px 6px'}},
      React.createElement('button',{onClick:()=>this.go(to),style:{display:'inline-flex',alignItems:'center',gap:6,background:C.soft,border:'none',borderRadius:999,padding:'9px 15px 9px 11px',color:C.ink,fontSize:14,fontWeight:700,cursor:'pointer'}},this.ic('back',17,C.ink),label)
    );
  }
  iconTile(C,cat,size=38){
    const col=this.catColor(C,cat);
    const glyph=cat==='Savings'?'goals':cat==='Income'?'up':cat==='Fixed'?'home':'wallet';
    return React.createElement('div',{style:{width:size,height:size,borderRadius:12,background:col+'1f',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},this.ic(glyph,size*0.5,col,2));
  }

  renderScreen(C){
    switch(this.state.route){
      case 'signin': return this.scSignin(C);
      case 'home': return this.scHome(C);
      case 'items': return this.scItems(C);
      case 'itemForm': return this.scItemForm(C);
      case 'newcycle': return this.scNewCycle(C);
      case 'goals': return this.scGoals(C);
      case 'goalDetail': return this.scGoalDetail(C);
      case 'goalForm': return this.scGoalForm(C);
      case 'history': return this.scHistory(C);
      case 'pastCycle': return this.scPastCycle(C);
      case 'settings': return this.scSettings(C);
      default: return null;
    }
  }

  // ---------- SIGN IN ----------
  press(d){
    if(this.state.passErr) this.setState({passErr:false});
    let p=this.state.pass;
    if(d==='del'){ this.setState({pass:p.slice(0,-1)}); return; }
    if(p.length>=4) return;
    p=p+d; this.setState({pass:p});
    if(p.length===4){ setTimeout(()=>{
      if(p==='2026'){ this.setState({loading:true}); setTimeout(()=>this.setState({route:'home',loading:false,pass:''}),650); }
      else this.setState({passErr:true,pass:''});
    },140); }
  }
  scSignin(C){
    const dots=[0,1,2,3].map(i=>React.createElement('div',{key:i,style:{width:13,height:13,borderRadius:'50%',border:`2px solid ${this.state.passErr?C.red:'rgba(255,255,255,.5)'}`,background:i<this.state.pass.length?(this.state.passErr?C.red:'#fff'):'transparent',transition:'background .15s'}}));
    const keys=['1','2','3','4','5','6','7','8','9','','0','del'];
    return React.createElement('div',{style:{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',padding:'96px 40px 46px',background:'radial-gradient(120% 70% at 25% 0%, #1b1f25 0%, #0b0c0e 58%)'}},
      React.createElement('div',{style:{width:66,height:66,borderRadius:18,background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.14)',display:'flex',alignItems:'center',justifyContent:'center'}},this.ic('wallet',30,'#fff',2)),
      React.createElement('h1',{style:{fontSize:26,fontWeight:800,color:'#fff',marginTop:18,letterSpacing:'-.02em'}},'Ledger'),
      React.createElement('p',{style:{color:'rgba(255,255,255,.55)',fontSize:14,fontWeight:500,marginTop:6,marginBottom:34}},'Enter your passcode'),
      React.createElement('div',{style:{display:'flex',gap:18,marginBottom:10,animation:this.state.passErr?'shake .4s':'none'}},dots),
      React.createElement('div',{style:{height:20,color:C.red,fontSize:13,fontWeight:600,marginBottom:16}},this.state.passErr?'Incorrect passcode — try again':''),
      React.createElement('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,70px)',gap:16,marginTop:'auto'}},
        keys.map((k,i)=>k===''?React.createElement('div',{key:i}):
          React.createElement('button',{key:i,onClick:()=>this.press(k),style:{width:70,height:70,borderRadius:'50%',border:'1px solid rgba(255,255,255,.13)',background:'rgba(255,255,255,.05)',fontSize:26,fontWeight:600,color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}},k==='del'?this.ic('backspace',24,'#fff'):k)
        )
      ),
      React.createElement('p',{style:{color:'rgba(255,255,255,.35)',fontSize:12,fontWeight:600,marginTop:22}},'hint: 2026')
    );
  }

  // ---------- HOME ----------
  scHome(C){
    const on=this.state.items.filter(i=>i.on);
    const income=5200, planned=on.reduce((s,i)=>s+i.amt,0), left=income-planned;
    const catTotal=cat=>on.filter(i=>i.cat===cat).reduce((s,i)=>s+i.amt,0);
    const savings=catTotal('Savings');
    const tabs=['Overview','Fixed','Variable','Savings'];
    let rows;
    if(this.state.tab==='Overview'){
      rows=[['Fixed',catTotal('Fixed')],['Variable',catTotal('Variable')],['Savings',catTotal('Savings')]].map(([cat,v])=>
        React.createElement('button',{key:cat,onClick:()=>this.go('items'),style:{width:'100%',display:'flex',alignItems:'center',gap:14,padding:'13px 4px',background:'none',border:'none',cursor:'pointer',borderTop:cat!=='Fixed'?`1px solid ${C.line}`:'none'}},
          this.iconTile(C,cat),
          React.createElement('span',{style:{flex:1,textAlign:'left',fontSize:15.5,fontWeight:700,color:C.ink}},cat),
          React.createElement('span',{style:{fontSize:15.5,fontWeight:700,color:C.ink}},this.money(v)),
          this.ic('chevR',17,C.sub,2)
        )
      );
    } else {
      const list=on.filter(i=>i.cat===this.state.tab);
      rows=list.length?list.map((i,idx)=>React.createElement('button',{key:i.id,onClick:()=>this.go('itemForm',{editItem:i.id,form:{name:i.name,cat:i.cat,amt:String(i.amt)}}),style:{width:'100%',display:'flex',alignItems:'center',gap:14,padding:'13px 4px',background:'none',border:'none',cursor:'pointer',borderTop:idx?`1px solid ${C.line}`:'none'}},
        this.iconTile(C,i.cat),
        React.createElement('span',{style:{flex:1,textAlign:'left',fontSize:15.5,fontWeight:700,color:C.ink}},i.name),
        React.createElement('span',{style:{fontSize:15.5,fontWeight:700,color:C.ink}},this.money(i.amt)),
        this.ic('chevR',17,C.sub,2)
      )):[React.createElement('div',{key:'e',style:{padding:'20px 4px',color:C.sub,fontSize:14,fontWeight:500}},'No active items in this category.')];
    }
    return React.createElement('div',{style:{height:'100%',background:C.dark,position:'relative'}},
      React.createElement('div',{style:{height:'100%',overflowY:'auto',paddingBottom:110}},
        // hero
        React.createElement('div',{style:{background:'radial-gradient(130% 80% at 15% 0%, #1c2027 0%, #0b0c0e 60%)',padding:'62px 22px 26px'}},
          React.createElement('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}},
            React.createElement('div',{},
              React.createElement('div',{style:{fontSize:22,fontWeight:800,color:'#fff',letterSpacing:'-.01em'}},'Morning, Morgan 👋'),
              React.createElement('div',{style:{fontSize:14,fontWeight:500,color:'rgba(255,255,255,.55)',marginTop:3}},"You're on track this cycle")
            ),
            React.createElement('button',{onClick:()=>this.flash('No new alerts.'),style:{width:42,height:42,borderRadius:'50%',background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.12)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}},this.ic('bell',19,'#fff',1.8))
          ),
          React.createElement('div',{style:{marginTop:20,background:C.darkCard,border:`1px solid ${C.darkLine}`,borderRadius:22,padding:'20px 20px 18px'}},
            React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
              React.createElement('span',{style:{fontSize:13.5,fontWeight:600,color:'rgba(255,255,255,.6)'}},'Left to allocate · '+this.state.cycleName),
              this.statusPill(C,'Open','green')
            ),
            React.createElement('div',{style:{fontSize:42,fontWeight:800,color:'#fff',letterSpacing:'-.03em',marginTop:8}},this.money(left)),
            React.createElement('div',{style:{fontSize:14,fontWeight:700,color:C.green,marginTop:4}},this.money(income)+' income · '+this.money(planned)+' planned'),
            React.createElement('button',{onClick:()=>this.go('newcycle',{form:{}}),style:{marginTop:16,width:'100%',padding:'12px',background:'rgba(255,255,255,.1)',border:`1px solid ${C.darkLine}`,borderRadius:12,color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer'}},'+ Open new cycle')
          )
        ),
        // sheet
        React.createElement('div',{style:{background:C.sheet,borderTopLeftRadius:28,borderTopRightRadius:28,marginTop:-14,minHeight:520,padding:'18px 22px 0'}},
          React.createElement('div',{style:{display:'flex',gap:6,background:C.soft,borderRadius:999,padding:5,marginBottom:18}},
            tabs.map(t=>React.createElement('button',{key:t,onClick:()=>this.setState({tab:t}),style:{flex:1,padding:'9px 0',borderRadius:999,border:'none',cursor:'pointer',fontSize:13,fontWeight:700,color:this.state.tab===t?C.ink:C.sub,background:this.state.tab===t?'#fff':'transparent',boxShadow:this.state.tab===t?'0 1px 4px rgba(10,12,14,.1)':'none'}},t))
          ),
          // insight
          React.createElement('div',{style:{background:C.tintBlue,borderRadius:18,padding:18,marginBottom:18}},
            React.createElement('div',{style:{display:'flex',alignItems:'center',gap:7,marginBottom:8}},
              React.createElement('span',{style:{width:7,height:7,borderRadius:'50%',background:C.blue}}),
              React.createElement('span',{style:{fontSize:12.5,fontWeight:800,color:C.blue,letterSpacing:'.02em'}},'Insight')
            ),
            React.createElement('div',{style:{fontSize:17,fontWeight:800,color:C.ink,letterSpacing:'-.01em'}},"You're set to save "+this.money(savings)+' this cycle'),
            React.createElement('div',{style:{fontSize:14,fontWeight:500,color:C.sub,marginTop:4}},'Spending is down 8% from last month'),
            React.createElement('button',{onClick:()=>this.go('goals'),style:{marginTop:10,background:'none',border:'none',color:C.blue,fontSize:14,fontWeight:700,cursor:'pointer',padding:0}},'View goals →')
          ),
          React.createElement('div',{style:{display:'flex',flexDirection:'column'}},rows),
          // recent activity
          React.createElement('div',{style:{marginTop:22,display:'flex',alignItems:'center',justifyContent:'space-between'}},
            React.createElement('h2',{style:{fontSize:17,fontWeight:800,color:C.ink}},'Recent activity'),
            React.createElement('button',{onClick:()=>this.go('history'),style:{background:'none',border:'none',color:C.blue,fontSize:14,fontWeight:700,cursor:'pointer'}},'View all')
          ),
          React.createElement('div',{style:{marginTop:8}},

  // ---------- ITEMS ----------

        ),
        React.createElement('div',{style:{marginTop:18,fontSize:19,fontWeight:800,color:C.ink}},'Cycle opened')

  }

        ),
        React.createElement('div',{style:{position:'relative',display:'flex',justifyContent:'center',margin:'22px 0'}},
          React.createElement('svg',{width:156,height:156,style:{transform:'rotate(-90deg)'}},

      this.backBar(C,'goals','Goals'),
      React.createElement('div',{style:{flex:1,overflowY:'auto',padding:'10px 22px 24px'}},
        React.createElement('h1',{style:{fontSize:26,fontWeight:800,color:C.ink,marginBottom:22,letterSpacing:'-.02em'}},editing?'Edit goal':'New goal'),
        this.fieldWrap(C,'Name',React.createElement('input',{value:f.name||'',onChange:e=>this.setForm('name',e.target.value),placeholder:'e.g. Kyoto trip',style:this.inpStyle(C)})),

          React.createElement('div',{style:{flex:1}},this.fieldWrap(C,'Target',React.createElement('input',{value:f.target||'',onChange:e=>this.setForm('target',e.target.value.replace(/[^0-9.]/g,'')),inputMode:'decimal',placeholder:'0',style:this.inpStyle(C)}))),
